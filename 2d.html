function sayTo(i){const n=NPC[i],el=$('say'),m=((el&&el.value)||'').trim();if(!m)return;n.chat.push(['You',m.replace(/</g,'&lt;')]);let r;const lm=m.toLowerCase();
 if(/love|marry|cute|fine/.test(lm))r=n.rel>50?'Hehe, you this person 🙈':'Ehh, slow down chale 😂';else if(/money|loan|borrow/.test(lm))r='Me too I dey find money o.';else if(/job|work/.test(lm))r=`Work as ${n.job} dey stress me but we move.`;else if(/\?$/.test(m))r=pick(['I no know o 🤷🏿','Hmm, maybe.','Ask me later, I dey busy.','Sure!']);else r=pick(LINES.reply.concat(LINES.topic));
 n.chat.push([n.name,r]);n.rel=Math.min(100,n.rel+1);S.needs.s=cl(S.needs.s+3);updSt(n);talkTo(i)}
function soc(i,k){const n=NPC[i];let ok=Math.random()<.55+sl('charisma')*.04+n.rel/200,txt;
 if(S.needs.y<20&&k!=='gift'){ok=false;txt=`${n.name} covered their nose. 😷 (Bathe first!)`;n.rel-=3}
 else switch(k){
 case'gist':advance(20,{s:20},'charisma');n.rel+=ok?R(3,7):-2;txt=ok?pick(LINES.topic):'They seem bored.';break;
 case'joke':advance(10,{f:10,s:10},'charisma');n.rel+=ok?R(4,9):-4;txt=ok?'😂😂 You too funny!':'...that was not funny.';break;
 case'compliment':advance(5,{s:8});n.rel+=ok?R(3,6):-1;txt=ok?'Aww, thank you!':'Okay...';break;
 case'flirt':advance(10,{s:12,f:6},'charisma');n.rel+=ok?R(5,10):-8;txt=ok?'🙈 Stop it!':'Please respect yourself 😒';break;
 case'date':if(S.money<100)return toast('Need GH₵100');S.money-=100;advance(120,{f:30,s:35,h:30});if(ok){n.st='dating';n.rel+=10;txt='That was lovely. Let\'s do this again 💕';ach('date','First date')}else{n.rel-=5;txt='I think we are better as friends.'}break;
 case'propose':if(S.money<3000)return toast('Knocking items (schnapps, cloth, etc.) cost GH₵3,000.');S.money-=3000;if(Math.random()<n.rel/100+.1){n.st='engaged';txt='YES! Let your family come and knock! 💍'}else{n.st='friend';n.rel-=30;txt='I\'m not ready... sorry.'}break;
 case'marry':if(S.money<5000)return toast('Wedding costs GH₵5,000.');S.money-=5000;n.st='spouse';S.spouse=n.name;n.rel=100;txt='We are married!!! 💒';ach('married','Happily married');S.needs.f=100;S.needs.s=100;log(`💒 Married ${n.name}.`);break;
 case'baby':advance(60,{f:20,s:20});if(day()-(S.lastBaby??-99)>=28&&Math.random()<.35){S.kids++;S.lastBaby=day();const kn=pick(Math.random()<.5?FIRST_F:FIRST_M);txt=`👶 Baby ${kn} is here! Outdooring on the 8th day.`;ach('parent','Proud parent');log(`👶 Your child ${kn} was born.`)}else txt='No baby news yet.';break;
 case'gift':if(S.money<100)return toast('Need GH₵100');S.money-=100;n.rel+=8;txt='Ei, God bless you! 🙏🏿';break}
 n.rel=Math.max(0,Math.min(100,n.rel));updSt(n);n.chat.push([n.name,txt]);talkTo(i)}
