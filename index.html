 food:(n,m)=>{const p=prof(n);m.told.food=1;return m.pf.food?`You like ${m.pf.food}, I remember. Me, ${p.food} anytime! Auntie Ama's chop bar is the best.`:`Me, ${p.food} is my number one. Auntie Ama's chop bar does it well. What do you like to eat?`+(m.expect='food',m.asked.food=1,'')},
 football:(n,m)=>{const p=prof(n);return `I'm a ${p.team} supporter, through thick and thin. The Black Stars must sit up for the next qualifier!`+(m.pf.team?'':(m.expect='team',m.asked.team=1,' Which club do you support?'))},
 music:(n,m)=>{const p=prof(n);return `I love ${p.music}. ${p.artist} is my favourite artist, their new jam is a banger 🔥.`+(m.pf.music?` You said you like ${m.pf.music} too.`:' What kind of music do you like?')},
 money:(n,m,c)=>rnd([`Money? Chale, everything is expensive. ${c.detty?'December prices are not funny. ':''}Save some in the bank, the interest helps.`,'Hustle hard, save small, and stay away from "double your money" schemes!','Me, I always keep rent money aside first. Landlords don\'t joke on Saturdays.']),
 advice:(n,m,c)=>{const t=[];if(!c.job)t.push('Get a job first, open the Jobs app on your phone. Even trotro mate pays rent.');if(c.needs.y<35)t.push('Respectfully... go and bathe first 😂 people notice.');if(c.needs.e<30)t.push('You look tired. Go home and sleep.');if(c.needs.h<30)t.push('Go and chop something, hunger is not good.');if(c.money<200)t.push('Money is low? Do some side hustle at the market or fix cars at Suame.');t.push('Learn a skill: coding at the Tech Hub or library study at Legon. Skills bring promotions.','Keep your rent money aside every Saturday. Eviction is no joke.','Go to church or the beach on Sunday, rest is important.');return 'My advice? '+t[0]},
 weather:(n,m,c)=>!c.power?'Dumsor again! ECG is testing our patience. My phone is dying too 😩':rnd(['This Accra heat ehn! Even the shade is sweating.','The rain last week flooded Circle again. When will they fix the gutters?','Harmattan is coming, buy your shea butter now 😄']),
 joke:()=>rnd(JOKES),
 dream:(n,m)=>{const p=prof(n);return `My dream? I want to ${p.dream}. One day, God willing.`+(m.pf.dream?` And you said you want to ${m.pf.dream.replace(/^i want to /i,'')}.`:(m.expect='dream',m.asked.dream=1,' What about you, what is your dream?'))},
 hobby:(n)=>{const p=prof(n);return `In my free time I like ${p.hobby}. And you, what do you do for fun?`},
city:(n,m,c,t)=>{const low=(t||'').toLowerCase();const L=[['traffic','The traffic in this Accra ehn! Circle to Madina can take 2 hours 😩'],['trotro','Trotro is still the best way to move. Just watch your change.'],['labadi','Labadi beach on Sunday is my therapy.'],['beach','Labadi beach on Sunday is my therapy.'],['osu','Osu at night is the place to be!'],['legon','Legon is beautiful, I wanted to study there.'],['kumasi','Kumasi is the Garden City, chale. Different vibe from Accra.']];const h=L.find(x=>low.includes(x[0]));if(h)return h[1];return rnd(['Accra is sweet but the traffic at Circle can kill you 😂','Osu at night is the place to be. Labadi beach on Sunday is my therapy.','Legon is beautiful, I wanted to study there.','East Legon people are living a different life, chale 😂','Trotro is still the best way to move. Just watch your change.'])},
 complimentnpc:(n)=>rnd(['Aww, you are too kind! You too, you are a good person.','Hehe, thank you! You have made my day 😊','Stop it, you will make me shy 🙈']),

 plans:(n,m,c)=>{if(n.rel>=20){const v=rnd(['Labadi Beach','Auntie Ama Chop Bar','Osu Night Spot','Accra Mall']);m.plan=v;return `Sure! Let's link up at ${v}. Just find me there and we go chill.`}return 'Hmm, maybe another time. Let\'s get to know each other small first.'},
 remember:(n,m)=>{const f=m.pf,bits=[];if(f.name)bits.push(`your name is ${f.name}`);if(f.job)bits.push(`you work as ${f.job}`);if(f.from)bits.push(`you are from ${f.from}`);if(f.food)bits.push(`you love ${f.food}`);if(f.team&&f.team!=='none')bits.push(`you support ${f.team}`);if(f.dream)bits.push(`your dream is "${f.dream}"`);
  return bits.length?`Of course I remember! ${cap(bits.join(', ').replace(/, ([^,]*)$/,' and $1'))}.`:'Hmm, you haven\'t told me much about yourself yet o. What is your name?'+(m.expect='name','')},
 work_me:(n,m,c)=>c.job?`How is work as ${c.job}? Are they treating you well?`:'You said work... are you working now? If not, check the Jobs app, there are many openings.',
 tired:(n,m,c)=>rnd(['Sorry o. Take some rest, eat something nice, and call your family.','Ah, sorry. Life in Accra can be hard. Want to go to the beach to relax?','Hmm, I understand. Tomorrow will be better, by God\'s grace.']),

 opinion:(n,m,c,t)=>{const top=intentTopic(t);return top?REPLY[top](n,m,c,t):rnd(['Honestly, I think it is fine, but people will always talk.','Hmm, I have mixed feelings about that one.','I like it! What do you think?'])}
};
function aJob(n){const j=n.job||'a trader';return /^[aeiou]/i.test(j)?'an '+j:'a '+j}
function intentTopic(t){const low=t.toLowerCase();for(const k of ['food','football','music','december','money','city','weather','dating','job','family'])if(IN.find(x=>x[0]===k)[1].test(low))return k;return null}
function fallback(n,m,c,t){const low=t.toLowerCase();const words=low.replace(/[^a-z' ]/g,' ').split(/\s+/).filter(w=>w.length>4&&!['about','would','could','should','there','their','think','really','something','because','where','which','what'].includes(w));const w=words.sort((a,b)=>b.length-a.length)[0];
 if(low.endsWith('?'))return rnd([`Hmm, that one I no sure o. ${w?cap(w)+'... ':''}What do you think?`,`Good question! Honestly, I don't know much about ${w||'that'}. Tell me more?`,'Eh, you are asking me hard questions 😂 Let me think about it.']);
 return rnd([w?`${cap(w)}? Interesting. Tell me more.`:'Mmm, I hear you.','Okay, I understand you.','True talk.',w?`Ahh, ${w}. I didn't know you were into that.`:'Hmm, go on.'])}
function threadFollow(n,m,c,k){if(k==='andyou'||k==='really'||k==='why'){const tp=m.topic;if(k==='andyou'){const map={howareyou:'howareyou',job:'job',food:'food',from:'from',football:'football',music:'music',dream:'dream',family:'family',hobby:'hobby'};if(tp&&map[tp])return REPLY[map[tp]](n,m,c);return rnd(['Me? I am good, just enjoying the day.','Me, I dey. Nothing much.'])}
 if(k==='really')return rnd(['For real! I no dey lie 😄','Yes o, true true.','Serious! Ask anybody.']);
 if(k==='why')return tp==='dating'?'Because I need to know you better first 😏':tp==='money'?'Because Accra is expensive and we must plan ahead.':tp==='job'?'Because that is how we survive, chale.':'Why? Life is like that sometimes 😅'}return null}
function reply(n,text,ctx){const m=mem(n),t=String(text).slice(0,300);m.turns++;const got=observe(n,t,ctx);let k=intent(t);let out=[];let dRel=1;
 // expectation from previous question takes priority if the player isn't changing topic strongly
 const EXK={food:'food',team:'football',job:'work_me',dec:'december',howareyou:'happy',day:'happy',dream:'dream'};
 const EXF={name:'name',job:'job',from:'from',food:'food',team:'team'};
 if(m.expect&&got.length&&!got.includes(EXF[m.expect]))m.expect=null;
 if(m.expect&&!t.includes('?')&&!STOPN.has(clean(t.toLowerCase()))&&(['statement','yes','no','happy','tired','work_me','greet','city'].includes(k)||EXK[m.expect]===k||(m.expect==='name'&&k!=='insult'))){const a=answerExpect(n,t,ctx);if(a){out.push(a);k='answered'}}
 if(k!=='answered'){
  if(got.length&&!t.includes('?')){const f=m.pf;const ack={name:`Nice to meet you, ${f.name}!`,job:`${cap(f.job||'')}? Respect, that is hard work.`,from:`${f.from}! Nice place.`,food:`${cap(f.food||'')}? You get taste!`,team:`${f.team} fan, eh? 😄`,kids:'Ei, God bless your children!',music:`${cap(f.music||'')} is sweet!`};out.push(ack[got[0]]);k='ack'}
  else{const th=threadFollow(n,m,ctx,k);if(th)out.push(th);else if(REPLY[k])out.push(REPLY[k](n,m,ctx,t));else if(k==='yes')out.push(rnd(['Okay, nice!','Alright 👍🏿','Good good.']));else if(k==='no')out.push(rnd(['Ah okay, no wahala.','Hmm, okay.','Fair enough.']));else out.push(fallback(n,m,ctx,t))}}
 if(k==='insult')dRel=-6;else if(k==='complimentnpc')dRel=3;else if(k==='dating')dRel=relTone(n)==='new'?-1:2;else if(got.length||k==='answered')dRel=2;
 if(!['askname','dating','insult','remember','bye'].includes(k)&&!/\?\s*\S*$/.test(out.join(' '))&&!m.expect&&chance(.6)){const f=followUp(n,ctx);if(f)out.push(f)}
 if(k!=='andyou'&&k!=='really'&&k!=='why'&&k!=='yes'&&k!=='no'&&k!=='statement'&&k!=='question'&&k!=='ack'&&k!=='answered')m.topic=k;
 let s=out.filter(Boolean).join(' ');if(m.pf.name&&chance(.2)&&!s.includes(m.pf.name)&&LOWOK.has(s.split(/[ ,!.?]/)[0]))s=m.pf.name+', '+s.charAt(0).toLowerCase()+s.slice(1);
 s=voice(n,s,{pre:k==='insult'?0:.3,post:k==='insult'?0:.35});m.last=s;return{text:s,dRel}}
function opener(n,ctx){const m=mem(n),f=m.pf,t=relTone(n);const tod=ctx.hour<12?'Good morning':ctx.hour<17?'Good afternoon':'Good evening';let s;
 if(m.turns===0)s=rnd([`${tod}! I don't think we've met. I'm ${n.name.split(' ')[0]}.`,`Hello! I'm ${n.name.split(' ')[0]}. You're new around here?`]);
 else if(t==='love')s=rnd([`My love! ${f.name?f.name+', ':''}I missed you 💕`,'Ei, my darling! Where have you been?']);
 else s=rnd([`Ei ${f.name||'my friend'}! Long time 😄`,`${tod}${f.name?', '+f.name:''}! How you dey?`,`${f.name||'Hey'}! Good to see you again.`]);
 if(m.plan&&ctx.venue===m.plan){s+=` You came to ${m.plan}! I'm happy 🙌🏿`;m.plan=null;n.rel=Math.min(100,n.rel+8)}
 else if(f.job&&chance(.4)&&m.turns>0)s+=` How is the ${f.job} work going?`,m.expect='day';
 else if(ctx.detty&&chance(.4))s+=' Are you enjoying Detty December?',m.expect='dec';
 return voice(n,s,{pre:.2,post:.3})}
function smalltalk(n,ctx){const m=mem(n);const p=prof(n);const opts=[`Did you hear? ${rnd(['Waakye price has gone up again 😩','They are fixing the Circle road, traffic everywhere','A new chop bar opened near the station','The Black Stars coach has named the squad'])}.`,`I was just thinking about ${p.hobby}. Do you like that too?`,`My ${rnd(['auntie','boss','landlord','pastor'])} said something funny today 😂 Life in Accra!`];if(ctx.detty)opts.push(rnd(['Who are you going with to AfroVibes Fest?','December prices dey vex me, but I go still enjoy 😂']));const s=rnd(opts);m.topic=null;return voice(n,s)}
function sysPrompt(n,ctx){const p=prof(n),m=mem(n),f=m.pf;const facts=Object.entries(f).filter(x=>x[1]).map(([k,v])=>`${k}: ${v}`).join('; ')||'nothing yet';
 return `You are ${n.name}, a ${p.age}-year-old ${n.job} living in Accra, Ghana. Personality: ${p.sty}. Hometown: ${p.town}. Family: ${p.fam}. Favourite food: ${p.food}. Football club: ${p.team}. Music: ${p.music} (favourite artist ${p.artist}). Hobby: ${p.hobby}. Dream: to ${p.dream}. The player is a ${S&&S.gender==='Female'?"woman (address her warmly as 'my sister' or 'madam')":"man (address him as 'my brother' or 'boss')"}. Relationship with the player: ${n.st} (${Math.round(n.rel)}/100). What you know about the player: ${facts}. It is ${ctx.detty?'Detty December':'an ordinary week'}, ${ctx.hour}:00. Reply as ${n.name.split(' ')[0]} in 1-2 short sentences of friendly Ghanaian English with light pidgin (chale, ei, paa, small small). Remember and use what the player told you. Ask a short follow-up question sometimes. Never say you are an AI.`}
return{reply,opener,smalltalk,observe,intent,prof,mem,sysPrompt}})();
if(typeof module!=='undefined')module.exports=DLG;

<script>

(function(){

// ---- HUD override ----
const _hud=hud;hud=function(){_hud();if(!S)return;const ks=NEEDS.map(n=>[n[0],n[1],n[2]]);if(S.needs.v!=null)ks.push(['v','✨','Vibes']);const nd=$('needs');nd.style.gridTemplateColumns='';nd.classList.toggle('n7',ks.length>6);
 nd.innerHTML=ks.map(([k,i,l])=>{const x=Math.round(S.needs[k]);const col=x>50?'#43d17a':x>25?'#f5c542':'#ff5252';return`<div class="nd${x<25?' low':''}" title="${l}: ${x}% — ${TIPS[k]}"><span class="ni">${i}</span><div class="nw"><div class="nl"><span>${l}</span><b>${x}</b></div><div class="nb"><div style="width:${x}%;background:${col}"></div></div></div></div>`}).join('');

 if(innerWidth<600){$('clock').textContent=$('clock').textContent.replace(/ · Wk\d+/,'').replace('Age ','🎂')}notices();drawMini();maybeTutorial()};
function notices(){const out=[];const c=S.job&&CB[S.job.id];const H_=hr(),D=day();
 if(c&&workday(c,D)&&D>=S.job.startDay&&S.job.lastWorked!==D){const v=VB[c.v];if(H_<c.st-2)out.push(['info',`⏰ Shift today ${c.st}:00 at ${v.name}`,'openJobs()']);else if(H_<=c.st+3)out.push(['urgent',`💼 Shift time! Go to ${v.e} ${v.name} &amp; clock in (by ${c.st+3}:00)`,`walkTo('${c.v}')`]);
  if(H_===c.st-1&&S._shAl!==D){S._shAl=D;toast(`⏰ Your ${c.name} shift starts at ${c.st}:00 — head to ${v.name}`)}}
 else if(c&&D<S.job.startDay)out.push(['info',`💼 New job starts tomorrow ${c.st}:00`,'openJobs()']);
 else if(!c)out.push(['info','💼 No job yet — open 📱 Phone → Jobs (all jobs open to everyone)','openJobs()']);
 if(!S.dadPays){const rent=HOMES[S.home][1];let dd=(5-dow()+7)%7;if(dd===0&&H_>=9)dd=7;if(dd<=2){const when=dd===0?'today 9:00':dd===1?'tomorrow 9:00':DOW[5]+' 9:00';out.push([S.money<rent?'urgent':'info',`🧾 Rent ${fmt(rent)} due ${when}${S.money<rent?' — you are short!':''}`,'openBank()'])}
  if(dow()===4&&H_===18&&S._rAl!==D){S._rAl=D;toast(`🧾 Reminder: rent ${fmt(rent)} is due tomorrow 9:00`)}}

 g.fillStyle='#4a4f52';for(const y of [6,17,28])g.fillRect(0,y*sy,mini.width,sy);for(const x of [7,20,33,44])g.fillRect(x*sx,0,sx,29*sy);
 const job=S.job&&CB[S.job.id];for(const v of V){g.fillStyle=v.c;g.fillRect(v.x*sx+.5,v.y*sy+.5,v.w*sx-1,v.h*sy-1);if(v.id==='home'||(job&&job.v===v.id)){g.strokeStyle=v.id==='home'?'#fcd116':'#ff5252';g.lineWidth=2;g.strokeRect(v.x*sx,v.y*sy,v.w*sx,v.h*sy)}}

// ---- onboarding tutorial ----
